<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Indrawti Devi Nari Shakti Foundation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h2 { color: #333; }
    .section { margin-bottom: 40px; }
    .card { background: #fff; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
    .card-date { font-size: 12px; color: #666; }
  </style>
</head>
<body>

  <h1>Ma Indrawti Devi Nari Shakti Foundation</h1>

  <!-- Members Section -->
  <div class="section">
    <h2>Members</h2>
    <div id="members-container">
      Loading members...
    </div>
  </div>

  <!-- Activities Section -->
  <div class="section">
    <h2>Activities</h2>
    <div id="activities-container">
      Loading activities...
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000"; // backend URL

    // -------- Fetch Members --------
    async function fetchMembers() {
      const container = document.getElementById("members-container");
      try {
        const res = await fetch(`${API_BASE}/members`);
        const members = await res.json();
        if(members.length === 0){
          container.innerHTML = "<p>No members found.</p>";
          return;
        }
        container.innerHTML = members.map(m => `
          <div class="card">
            <div class="card-title">${m.name} (${m.memberId})</div>
            <div>Mobile: ${m.mobile}</div>
            <div>Interest: ${m.interest}</div>
            <div class="card-date">Joined: ${new Date(m.createdAt).toLocaleDateString()}</div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color:red;">Error loading members</p>`;
        console.error(err);
      }
    }

    // -------- Fetch Activities --------
    async function fetchActivities() {
      const container = document.getElementById("activities-container");
      try {
        const res = await fetch(`${API_BASE}/activities`);
        const activities = await res.json();
        if(activities.length === 0){
          container.innerHTML = "<p>No activities found.</p>";
          return;
        }
        container.innerHTML = activities.map(a => `
          <div class="card">
            <div class="card-title">${a.title}</div>
            <div>${a.description || ''}</div>
            <div class="card-date">Date: ${new Date(a.date).toLocaleDateString()}</div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color:red;">Error loading activities</p>`;
        console.error(err);
      }
    }

    // -------- Initialize --------
    fetchMembers();
    fetchActivities();
  </script>

</body>
  </html>
